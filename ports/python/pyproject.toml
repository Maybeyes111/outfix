[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outfix"
version = "0.3.0"
description = "Clean malformed/polluted LLM output (think blocks, tool-call wrappers, fences, preamble/postamble, truncated JSON) before it hits your parser"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "outfix contributors" }]
keywords = ["llm", "json-repair", "qwen", "deepseek", "data-cleaning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.setuptools.packages.find]
include = ["outfix*"]
